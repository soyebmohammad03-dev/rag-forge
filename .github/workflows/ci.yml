name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: Backend (format, lint, strict mypy, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Cache the pinned models (keyed by the revisions in domain/models.py)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('apps/api/src/rag_forge/domain/models.py') }}
      - run: uv sync --locked
      - name: Format
        run: uv run ruff format --check src tests
      - name: Lint
        run: uv run ruff check src tests
      - name: Type check (strict)
        run: uv run mypy src tests
      - name: Tests (real pinned models, engine not mocked)
        run: uv run pytest -q

  web:
    name: Frontend (API contracts, lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cd apps/api && uv sync --locked
      - name: API contracts are up to date
        run: npm run contracts && git diff --exit-code packages/shared
      - name: Lint, typecheck, tests, production build
        run: npm run check
